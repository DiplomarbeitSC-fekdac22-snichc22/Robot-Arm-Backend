[coordinate_system]
name = "robot_base"
units = "mm"
origin = "Centre of the roof mounting plate at the ceiling (kinematics top reference)"
x_positive = "toward the objects"
y_positive = "down"
z_positive = "right when looking toward the objects"
# Y uses measured sticker centres: 134 + 10 and 364 + 10 mm from the ceiling.
# The existing X=130 mm and shelf centring in Z still require confirmation.
# Stereo reconstruction must also pass independent distance validation.
shelf_layout_physically_validated = false

[aruco]
dictionary = "DICT_4X4_50"
shelf_marker_size_mm = 14.0

[markers."20"]
role = "shelf_top_left"
center_mm = [130.0, 144.0, -190.0]
orientation = "upright"
facing = "-x"

[markers."21"]
role = "shelf_top_right"
center_mm = [130.0, 144.0, 190.0]
orientation = "upright"
facing = "-x"

[markers."22"]
role = "shelf_bottom_left"
center_mm = [130.0, 374.0, -190.0]
orientation = "upright"
facing = "-x"

[markers."23"]
role = "shelf_bottom_right"
center_mm = [130.0, 374.0, 190.0]
orientation = "upright"
facing = "-x"
